[project]
name = "bt-dualboot-sync"
version = "1.0.1"
description = "Sync Bluetooth for dualboot Linux and Windows"
readme = "bt_dualboot/README.md"
license = "MIT"
authors = [
    { name = "Vedran Hrabar", email = "vedran.hrabar@outlook.com" },
]
requires-python = ">=3.11"
keywords = ["bluetooth", "dualboot", "sync", "pairing", "keys"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Multimedia",
    "Topic :: System",
    "Topic :: System :: Operating System",
    "Topic :: System :: Systems Administration",
]

dependencies = []

[project.urls]
homepage = "https://github.com/vhrabar/bt-dualboot"
repository = "https://github.com/vhrabar/bt-dualboot"
documentation =  "https://github.com/vhrabar/bt-dualboot/wiki"
"bug Tracker" = "https://github.com/vhrabar/bt-dualboot/issues"


[project.scripts]
bt-dualboot = "bt_dualboot.cli.app:main"


[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]


[dependency-groups]
dev = [
    "pytest",
    "pytest-watch",
    "pytest-snapshot",
    "libfaketime",
    "black",
    "autopep8",
    "flake8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bug: known-bug regression test, run via dev/start-tests-bug (-m bug)",
    "manual: interactive test spawning a debug shell, excluded by default, run via dev/start-tests-manual (-m manual)",
]
addopts = "-m 'not manual'"

[tool.hatch.build.targets.wheel]
packages = ["bt_dualboot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
