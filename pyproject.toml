[project]
name = "bt-dualboot-sync"
version = "0.1.0"
description = "Sync Bluetooth for dualboot Linux and Windows"
readme = "bt_dualboot/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vedran Hrabar", email = "vedran.hrabar@outlook.com" },
]
requires-python = ">=3.11"
keywords = ["bluetooth", "dualboot", "sync", "pairing", "keys"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Multimedia",
    "Topic :: System",
    "Topic :: System :: Operating System",
    "Topic :: System :: Systems Administration",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/vhrabar/bt-dualboot"
Repository = "https://github.com/vhrabar/bt-dualboot"
Documentation = "https://github.com/vhrabar/bt-dualboot/wiki"
Issues = "https://github.com/vhrabar/bt-dualboot/issues"
Changelog = "https://github.com/vhrabar/bt-dualboot/blob/main/CHANGELOG.md"


[project.scripts]
bt-dualboot = "bt_dualboot.cli.app:main"


[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]


[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-watch",
    "pytest-snapshot>=0.9",
    "libfaketime",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bug: known-bug regression test, run via dev/start-tests-bug (-m bug)",
    "manual: interactive test spawning a debug shell, excluded by default, run via dev/start-tests-manual (-m manual)",
]
addopts = "-m 'not manual'"

[tool.hatch.build.targets.wheel]
packages = ["bt_dualboot"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"



[tool.ruff]
line-length = 105
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*"     = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["bt_dualboot"]

[tool.ruff.format]
quote-style           = "double"
indent-style          = "space"
docstring-code-format = true
